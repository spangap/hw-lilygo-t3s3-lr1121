# hw-lilygo-t3s3-lr1121 — board HAL straddle for the LilyGo T3-S3 (LoRa32) with LR1121.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-lilygo-t3s3-lr1121` and inherits the
# board's pin map, bring-up hook and hardware kconfig.
#
# Owns the board HAL (esp-idf/src/t3s3lr1121.cpp: the LoRa CS park). app_main,
# partitions, the OTA story and the browser SPA are NOT here — they belong to
# the buildable. Board reference:
# https://wiki.lilygo.cc/products/t3-series/t3-s3/
#
# This straddle targets the LR1121 (dual-band LR11x0: sub-GHz and 2.4 GHz)
# variant of the T3-S3. Same PCB as the SX1262 one (hw-lilygo-t3s3-sx1262) —
# same SPI pins, OLED, microSD — but the radio takes its IRQ on GPIO 36, runs a
# 3.0 V TCXO, and switches its antenna path from its own DIO5/DIO6 rather than
# an SX126x's DIO2. Wired: LoRa, microSD, and the 0.96" SSD1306 OLED as a paged
# status display via spangap/tinylcd (BOOT button advances the page).
schema_version: 1
name: spangap/hw-lilygo-t3s3-lr1121
prefix: t3s3lr1121
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# Board bring-up as a registered Service. app_main is generated by the buildable;
# it constructs T3s3Lr1121Board and walks it. T3s3Lr1121Board::onStart is
# bare-hardware (LoRa CS park) and runs before spangapInit(). No onInit — the
# OLED UI is tinylcd's own service, not a board hook.
services:
  - { class: T3s3Lr1121Board, header: t3s3lr1121.h }
# The board's screen is a mono OLED, so the board is what stages the paged
# OLED UI; the buildable stays display-agnostic.
additional_installs:
  - spangap/tinylcd
  # The LR1121 is soldered to this board, so the board stages the LoRa
  # interface — and LoRaMon with it, which iface-lora pulls in. Gated on rns,
  # because it is a Reticulum interface: a buildable that is not a Reticulum
  # node must not inherit the mesh from the board's modem.
  - { install: reticulous/iface-lora, when: reticulous/rns }
# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: ESP32-S3-WROOM-1(U) with the ESP32-S3FH4R2 die — 4 MB flash,
  # 2 MB *quad* PSRAM, as on the SX1262 T3-S3.
  - CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  # State floor at 3.75 MB: the least that fits the reticulous binary next to
  # the ~704 KB `fixed` partition, leaving /state 256 KB — enough because bulk
  # data belongs on the microSD card. Without it `app` fills all 4 MB and no
  # /state partition exists. Changing this relocates /state → existing devices
  # factory-reset on the next boot.
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=3840
  - CONFIG_SPIRAM_MODE_QUAD=y
  # One LR1121 on its own SPI bus (SPI2/FSPI), separate from both the flash bus
  # and the SD card's bus. Pins per Meshtastic's tlora_t3s3_v1 variant (its
  # USE_LR1121 block): the SX1262's SPI/CS/RST/BUSY pins, IRQ (chip DIO9) on
  # GPIO 36, 3.0 V TCXO. The antenna switch is the radio's own: DIO5 high in
  # receive, DIO6 high in sub-GHz transmit, both low in standby and on 2.4 GHz
  # transmit (LilyGo's and Meshtastic's rfswitch table for this board).
  # Gated on iface-lora: the CONFIG_LORA_* symbols are DEFINED by that
  # straddle's Kconfig, so applying these in a build without it would warn as
  # unknown symbols.
  - when: reticulous/iface-lora
    set:
      - CONFIG_LORA_COUNT=1
      - CONFIG_LORA_SPI_HOST=2
      - CONFIG_LORA_SCK_PIN=5
      - CONFIG_LORA_MOSI_PIN=6
      - CONFIG_LORA_MISO_PIN=3
      - CONFIG_LORA0_CS_PIN=7
      - CONFIG_LORA0_DIO1_PIN=36
      - CONFIG_LORA0_BUSY_PIN=34
      - CONFIG_LORA0_RST_PIN=8
      - CONFIG_LORA0_TCXO_MV=3000
      - CONFIG_LORA0_RADIO_LR1121=y
      - CONFIG_LORA0_LR_RFSW_IDLE=0x00
      - CONFIG_LORA0_LR_RFSW_RX=0x01
      - CONFIG_LORA0_LR_RFSW_TX=0x02
      - CONFIG_LORA0_LR_RFSW_TX_HF=0x00
  # microSD card on its OWN SPI bus (SPI3/HSPI), as on the SX1262 T3-S3.
  # spangapInit() calls fs_mount_sd() automatically when SDCARD=y.
  - CONFIG_SPANGAP_SDCARD=y
  - CONFIG_SPANGAP_SDCARD_BUS_SPI=y
  - CONFIG_SPANGAP_SDCARD_SPI_HOST=3
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_CS=13
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_SCK=14
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MOSI=11
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MISO=2
  # 0.96" SSD1306 128x64 OLED on I2C (SDA 18 / SCL 17, no reset line). BOOT
  # button (GPIO 0) advances the page. Gated: without tinylcd staged these
  # symbols don't exist.
  - when: spangap/tinylcd
    set:
      - CONFIG_TINYLCD_SDA_PIN=18
      - CONFIG_TINYLCD_SCL_PIN=17
      - CONFIG_TINYLCD_BUTTON_PIN=0
